<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="404 Not Found - Stackly Houses Real Estate">
    <title>404 Not Found - Stackly Houses</title>
    <!-- FAVICON -->
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <!-- FONT AWESOME ICON KIT -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- STYLE SHEET -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- PRELOADER -->
    <div id="preloader">
        <div class="preloader-inner">
            <img src="images/stackly-logo%20golden.webp" alt="Stackly Logo" class="preloader-logo">
            <div class="preloader-spinner"></div>
        </div>
    </div>

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- MAIN 404 CONTENT -->
        <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--dark-bg); padding: 4rem 2rem; text-align: center;">
            <div style="max-width: 600px; margin: 0 auto;">
                <div style="font-size: 8rem; font-weight: 900; color: var(--accent); line-height: 1; margin-bottom: 1.5rem; letter-spacing: -2px;">404</div>
                <h2 style="font-size: 2.25rem; font-weight: 800; color: var(--text-white); margin-bottom: 1rem; line-height: 1.3;">Oops! This Property is Off the Market</h2>
                <p style="color: var(--text-light); font-size: 1rem; line-height: 1.7; margin-bottom: 2.5rem;">The address or listing you are looking for has been moved, renamed, or is currently unavailable. Let's redirect you to a better location.</p>
                <div style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-yellow" style="padding: 0.9rem 2.5rem; font-weight: 700; font-size: 0.95rem; color: var(--dark-bg);">Back to Home Page</a>
                    <button onclick="history.back();" class="btn btn-outline" style="padding: 0.9rem 2.5rem; font-weight: 700; font-size: 0.95rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: var(--radius-sm); color: var(--text-white); background: none; cursor: pointer; display: inline-block; transition: var(--transition);">Previous Page</button>
                </div>
            </div>
        </main>

    </div>
    <!-- Wrapper / End -->

    <!-- CUSTOM MAIN JS -->
    <script src="js/main.js"></script>
</body>

</html>
